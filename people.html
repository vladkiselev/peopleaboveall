<style>
  /* ===== БАЗОВЫЕ СТИЛИ (как на других страницах) ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #F5F0E8;
    --ink: #1A1714;
    --warm: #C8A97E;
    --rust: #8B4513;
    --muted: #6B6560;

  }
  body {
    background: var(--cream);

    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.6;
  }
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 24px 48px;
    display: flex;
    justify-content: space-between;

  .nav-logo {

    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
  }
  .nav-logo:hover { color: var(--ink); }
  .nav-links {
    display: flex;
    gap: 32px;
    align-items: center;
  }
  .nav-link {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.3s;
  }
  .nav-link.active { color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
  .nav-link:hover { color: var(--ink); }
  .lang-switch {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    background: transparent;
    border: 1px solid var(--border);
    padding: 6px 12px;

    color: var(--muted);

  .lang-switch:hover {

  .hero-mini {

  .hero-mini h1 em { font-style: italic; color: var(--warm); }
  .hero-mini p {
    font-size: 20px;
    font-weight: 300;
    color: var(--muted);
    max-width: 600px;
    margin: 0 auto;
  }
  
  /* Поисковая строка + кнопка в строке */
  .search-section {
    padding: 0 80px 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .search-wrapper {
    position: relative;
    width: 100%;
    max-width: 400px;
    flex: 0 1 auto;
  }
  .search-icon {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);

  .search-input {

  /* Подсветка поиска */

  .filters {

  .contact-btn:hover {

  .people-grid {

  .person-card {

    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 16px 32px;
    border: none;
    cursor: pointer;
    display: inline-block;

  }
  .btn-join-bottom:hover { background: var(--rust); }
  
  /* МОДАЛЬНЫЕ ОКНА И ФОРМЫ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,23,20,0.7);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;

  }
  .modal-overlay.open {
    opacity: 1;

  }
  .modal {
    background: var(--cream);
    padding: 64px;

    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;

  footer {

  @media (max-width: 900px) {

  @keyframes sk-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

<script>
  // ---------- ДАННЫЕ УЧАСТНИКОВ ----------
  // ── GOOGLE SHEETS CSV ───────────────────────────────────────────
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMEdg_iBj9kvqbOkNWijq5HaHzcgKvNQGb4ucRjyMGZInPBYgKHBlYXa2dgW3B2BeI8C2uXRgxGw5O/pub?gid=0&single=true&output=csv';
  // ───────────────────────────────────────────────────────────────

  let peopleData = { ru: [], en: [] };

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
    return lines.slice(1).map(line => {
      const values = [];
      let cur = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQuotes = !inQuotes; }
        else if (ch === ',' && !inQuotes) { values.push(cur.trim()); cur = ''; }
        else { cur += ch; }
      }
      values.push(cur.trim());
      const obj = {};
      headers.forEach((h, i) => obj[h] = (values[i] || '').replace(/^"|"$/g, '').trim());
      return obj;
    });
  }

  function csvToPeople(rows) {
    const visible = rows.filter(r => (r.visible || '').toLowerCase() === 'yes');
    const ru = visible.map(r => ({
      id:     parseInt(r.id) || 0,
      name:   r.name_ru || r.name_en || '',
      role:   r.role_ru || '',
      bio:    r.help_ru || '',
      skills: (r.tags_ru || '').split(' ').map(t => t.trim()).filter(Boolean),
      location: r.city_ru || '',
      social: r.social || '',
    }));
    const en = visible.map(r => ({
      id:     parseInt(r.id) || 0,
      name:   r.name_en || r.name_ru || '',
      role:   r.role_en || '',
      bio:    r.help_en || '',
      skills: (r.tags_en || '').split(' ').map(t => t.trim()).filter(Boolean),
      location: r.city_en || '',
      social: r.social || '',
    }));
    return { ru, en };
  }

  async function loadPeople() {
    const grid = document.getElementById('people-grid');
    const skCard = `<div class="person-card"><div class="sk sk-role"></div><div class="sk sk-name"></div><div class="sk sk-line"></div><div class="sk sk-line2"></div><div class="sk-tags"><div class="sk sk-tag"></div><div class="sk sk-tag"></div></div><div class="sk sk-city"></div><div class="sk sk-btn"></div></div>`;
    grid.innerHTML = skCard + skCard + skCard;
    try {
      const resp = await fetch(SHEET_CSV_URL + '&t=' + Date.now());
      if (!resp.ok) throw new Error('fetch failed');
      const text = await resp.text();
      const rows = parseCSV(text);
      peopleData = csvToPeople(rows);
      renderFilters();
      renderPeople();
    } catch(e) {
      grid.innerHTML = '<div class="empty-state">Не удалось загрузить данные. Попробуйте обновить страницу.</div>';
      console.error('Sheet load error:', e);
    }
  }

  // ---------- ПЕРЕВОДЫ (полные, с заголовками, лейблами, плейсхолдерами) ----------
  const translations = {
    ru: {
      nav_ideas: "Идеи", nav_people: "Люди", nav_about: "О проекте",
      hero_title_start: "Атлас", hero_title_em: "людей", hero_subtitle: "Удивительные люди, готовые делиться опытом, сотрудничать и создавать новое.",
      join_btn: "Добавить себя в каталог",
      filter_all: "Все", empty_state: "Пока нет людей в этой категории. Добавьте себя первым!",
      contact_btn: "Связаться",

  let currentLang = localStorage.getItem('paa_lang') || 'en';
  let activeRoleFilter = "all";
  let searchQuery = "";
  let searchDebounceTimer = null;
  let currentPerson = null;

  function t(key, ...args) {
    let val = translations[currentLang][key];
    if (typeof val === 'string' && args.length) val = val.replace('%s', args[0]);
    return val || key;
  }

  function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
  function highlightText(text, query) {
    if (!query || !text) return text;
    try {
      const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
      return text.replace(regex, `<span class="search-highlight">$1</span>`);
    } catch(e) { return text; }
  }

  function updateSearchPlaceholder() {
    const inp = document.getElementById("search-input");
    if (inp) inp.placeholder = t('search_placeholder');
  }
  function updateJoinButtons() {
    const txt = t('join_btn');
    const top = document.getElementById("topJoinBtn");
    const bottom = document.getElementById("bottomJoinBtn");
    if (top) top.textContent = txt;
    if (bottom) bottom.textContent = txt;
  }

  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('paa_lang', lang);
    document.documentElement.lang = lang === 'ru' ? 'ru' : 'en';
    document.querySelector('#lang-switch').textContent = lang === 'ru' ? 'EN' : 'RU';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[currentLang][key]) el.textContent = translations[currentLang][key];
    });
    updateSearchPlaceholder();
    updateJoinButtons();
    const searchInput = document.getElementById("search-input");
    if (searchInput) { searchInput.value = ""; searchQuery = ""; }
    renderFilters();
    renderPeople();
  }

  function personMatchesSearch(person, query) {
    if (!query) return true;
    const q = query.toLowerCase().trim();
    const fields = [person.name, person.role, person.bio, person.location, ...(person.skills || [])].join(' ').toLowerCase();
    return fields.includes(q);
  }
  function getFilteredPeople() {
    let filtered = peopleData[currentLang];
    if (activeRoleFilter !== "all") filtered = filtered.filter(p => p.role === activeRoleFilter);
    if (searchQuery) filtered = filtered.filter(p => personMatchesSearch(p, searchQuery));
    return filtered;
  }
  function renderPeople() {
    const grid = document.getElementById("people-grid");
    const filtered = getFilteredPeople();
    if (!filtered.length) {
      grid.innerHTML = `<div class="empty-state">${t('empty_state')}</div>`;
      return;
    }
    grid.innerHTML = filtered.map(person => `
      <div class="person-card">
        <div class="person-role">${highlightText(person.role, searchQuery)}</div>
        <h3 class="person-name">${highlightText(person.name, searchQuery)}</h3>
        <p class="person-bio">${highlightText(person.bio, searchQuery)}</p>
        <div class="person-skills">${person.skills.map(s => `<span class="skill-tag">${highlightText(s, searchQuery)}</span>`).join('')}</div>
        <div class="person-location">📍 ${person.location}</div>
        <div style="margin-top: 20px;">
          <button class=\"contact-btn\" onclick=\"openContactModal(${person.id})\">${t('contact_btn')}</button>
        </div>
      </div>
    `).join('');
  }

  function getUniqueRoles() {
    const roles = peopleData[currentLang].map(p => p.role);
    return ["all", ...new Set(roles)];
  }
  function renderFilters() {
    const roles = getUniqueRoles();
    const bar = document.getElementById("filter-bar");
    const allLabel = t('filter_all');
    bar.innerHTML = roles.map(role => `<button class="filter-chip ${activeRoleFilter === role ? 'active' : ''}" data-role="${role}">${role === 'all' ? allLabel : role}</button>`).join('');
    document.querySelectorAll('.filter-chip').forEach(btn => btn.addEventListener('click', () => {
      activeRoleFilter = btn.dataset.role;
      renderFilters();
      renderPeople();
    }));
  }
  function onSearchInput(e) {
    if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => { searchQuery = e.target.value; renderPeople(); }, 300);
  }

  // ---- Форма добавления в каталог (как на главной) ----
  function openJoinFormModal() {
    const modalContent = document.getElementById("join-modal-content");
    modalContent.innerHTML = `
      <div id="join-form-container">
        <h3>${t('join_modal_title')}</h3>
        <p class="modal-sub">${t('join_modal_subtitle')}</p>
        <div class="error-message" id="join-error"></div>
        <div class="form-group"><label>${t('join_name_label')}</label><input type="text" id="join-name" autocomplete="name" placeholder="${t('join_name_ph')}"></div>
        <div class="form-group"><label>${t('join_email_label')}</label><input type="email" id="join-email" autocomplete="email" placeholder="${t('join_email_ph')}"></div>
        <div class="form-group"><label>${t('join_social_label')}</label><input type="text" id="join-social" placeholder="${t('join_social_ph')}"></div>
        <div class="form-group"><label>${t('join_role_label')}</label>
          <select id="join-role">
            <option value="">${currentLang === 'ru' ? 'Выбери роль' : 'Select role'}</option>
            <option>${currentLang === 'ru' ? 'Разработчик' : 'Developer'}</option>
            <option>${currentLang === 'ru' ? 'Дизайнер' : 'Designer'}</option>
            <option>${currentLang === 'ru' ? 'Маркетолог' : 'Marketer'}</option>
            <option>${currentLang === 'ru' ? 'Предприниматель' : 'Entrepreneur'}</option>
            <option>${currentLang === 'ru' ? 'Психолог' : 'Psychologist'}</option>
            <option>${currentLang === 'ru' ? 'Врач' : 'Doctor'}</option>
            <option>${currentLang === 'ru' ? 'Исследователь' : 'Researcher'}</option>
            <option>${currentLang === 'ru' ? 'Другое' : 'Other'}</option>
          </select>
        </div>
        <div class="form-group"><label>${t('join_help_label')}</label><textarea id="join-help" rows="3" placeholder="${t('join_help_ph')}"></textarea></div>
        <div class="form-group"><label>${t('join_seek_label')}</label><textarea id="join-seek" rows="2" placeholder="${t('join_seek_ph')}"></textarea></div>
        <div class="form-group"><label>${t('join_city_label')}</label><input type="text" id="join-city" placeholder="${t('join_city_ph')}"></div>
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;">
          <input type="checkbox" id="consent-join" style="margin-top:4px;cursor:pointer;">
          <label for="consent-join" style="font-size:13px;font-weight:300;color:var(--muted);line-height:1.5;cursor:pointer;">
            ${currentLang === 'ru' ? 'Я согласен с' : 'I agree to the'} <a href="privacy.html" target="_blank" style="color:var(--ink);border-bottom:1px solid var(--border);">Privacy Policy</a> ${currentLang === 'ru' ? 'и' : 'and'} <a href="privacy.html" target="_blank" style="color:var(--ink);border-bottom:1px solid var(--border);">Terms of Use</a>
          </label>
        </div>
        <button class="form-submit" id="join-submit-btn">${t('join_submit_btn')}</button>
        <p class="form-note">${t('join_note')}</p>
      </div>
      <div id="join-success" style="display:none;"><div class="form-success-icon">✦</div><h4>${t('join_success_title')}</h4><p>${t('join_success_text')}</p></div>
    `;
    document.getElementById("join-submit-btn").addEventListener("click", submitJoinRequest);
    document.getElementById("joinModal").classList.add("open");
  }
  function closeJoinModal() { document.getElementById("joinModal").classList.remove("open"); }
  async function submitJoinRequest() {
    const name = document.getElementById("join-name").value.trim();
    const email = document.getElementById("join-email").value.trim();
    const role = document.getElementById("join-role").value;
    const help = document.getElementById("join-help").value.trim();
    const errorDiv = document.getElementById("join-error");
    if (!name || !email || !role || !help) {
      errorDiv.textContent = t('join_error_default');
      errorDiv.style.display = "block";
      setTimeout(() => errorDiv.style.display = "none", 3000);
      return;
    }
    const consent = document.getElementById('consent-join');
    if (consent && !consent.checked) {
      errorDiv.textContent = currentLang === 'ru' ? 'Подтвердите согласие с политикой конфиденциальности' : 'Please accept the Privacy Policy';
      errorDiv.style.display = 'block';
      setTimeout(() => errorDiv.style.display = 'none', 3000);
      return;
    }
    errorDiv.style.display = "none";
    const btn = document.getElementById("join-submit-btn");
    const original = btn.textContent;
    btn.textContent = "Sending...";
    btn.disabled = true;
    const data = {
      _subject: `[PAA] New catalog member: ${name} (${role})`,
      type: "CATALOG",
      name, email,
      social: document.getElementById("join-social").value.trim(),
      role: role,
      help: help,
      seek: document.getElementById("join-seek").value.trim(),
      city: document.getElementById("join-city").value.trim(),
      _replyto: email
    };
    const FORMSPREE_URL = 'https://formspree.io/f/xwvyzbvr';
    try {
      const resp = await fetch(FORMSPREE_URL, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(data) });
      if (resp.ok) {
        document.getElementById("join-form-container").style.display = "none";
        document.getElementById("join-success").style.display = "block";
      } else throw new Error();
    } catch(e) {
      errorDiv.textContent = "❌ " + (currentLang === 'ru' ? "Ошибка отправки. Попробуйте позже." : "Sending error. Please try again.");
      errorDiv.style.display = "block";
    } finally {
      btn.textContent = original;
      btn.disabled = false;
    }
  }

  // ---- Форма связи с участником ----
  function openContactModal(personId) {
    const person = peopleData[currentLang].find(p => p.id === personId);
    if (!person) return;
    currentPerson = person;
    const modalContent = document.getElementById("contact-modal-content");
    modalContent.innerHTML = `
      <div id="contact-form-container">
        <h3>${t('contact_modal_title', person.name.split(' ')[0])}</h3>
        <p class="modal-sub">${t('contact_modal_subtitle')}</p>
        <div class="error-message" id="contact-error"></div>
        <div class="form-group"><label>${t('contact_name_label')}</label><input type="text" id="contact-name" autocomplete="name" placeholder="${t('contact_name_ph')}"></div>
        <div class="form-group"><label>${t('contact_contact_label')}</label><input type="text" id="contact-contact" autocomplete="email" placeholder="${t('contact_contact_ph')}"></div>
        <div class="form-group"><label>${t('contact_purpose_label')}</label>
          <select id="contact-purpose">
            ${Object.entries(translations[currentLang].contact_purpose_options).map(([val, label]) => `<option value="${val}">${label}</option>`).join('')}
          </select>
        </div>
        <div class="form-group"><label>${t('contact_message_label')}</label><textarea id="contact-message" rows="3" placeholder="${t('contact_message_ph')}"></textarea></div>
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;">
          <input type="checkbox" id="consent-contact" style="margin-top:4px;cursor:pointer;">
          <label for="consent-contact" style="font-size:13px;font-weight:300;color:var(--muted);line-height:1.5;cursor:pointer;">
            ${currentLang === 'ru' ? 'Я согласен с' : 'I agree to the'} <a href="privacy.html" target="_blank" style="color:var(--ink);border-bottom:1px solid var(--border);">Privacy Policy</a> ${currentLang === 'ru' ? 'и' : 'and'} <a href="privacy.html" target="_blank" style="color:var(--ink);border-bottom:1px solid var(--border);">Terms of Use</a>
          </label>
        </div>
        <button class="form-submit" id="contact-submit-btn">${t('contact_submit_btn')}</button>
        <p class="form-note">${t('contact_note')}</p>
      </div>
      <div id="contact-success" style="display:none;"><div class="form-success-icon">✦</div><h4>${t('contact_success_title')}</h4><p>${t('contact_success_text')}</p></div>
    `;
    document.getElementById("contact-submit-btn").addEventListener("click", submitContactRequest);
    document.getElementById("contactModal").classList.add("open");
  }
  function closeContactModal() { document.getElementById("contactModal").classList.remove("open"); }
  async function submitContactRequest() {
    const name = document.getElementById("contact-name").value.trim();
    const contact = document.getElementById("contact-contact").value.trim();
    const purpose = document.getElementById("contact-purpose").value;
    const message = document.getElementById("contact-message").value.trim();
    const errorDiv = document.getElementById("contact-error");
    if (!name || !contact || !purpose) {
      errorDiv.textContent = t('contact_error_default');
      errorDiv.style.display = "block";
      setTimeout(() => errorDiv.style.display = "none", 3000);
      return;
    }
    const consent = document.getElementById('consent-contact');
    if (consent && !consent.checked) {
      errorDiv.textContent = currentLang === 'ru' ? 'Подтвердите согласие с политикой конфиденциальности' : 'Please accept the Privacy Policy';
      errorDiv.style.display = 'block';
      setTimeout(() => errorDiv.style.display = 'none', 3000);
      return;
    }
    errorDiv.style.display = "none";
    const btn = document.getElementById("contact-submit-btn");
    const original = btn.textContent;
    btn.textContent = "Sending...";
    btn.disabled = true;
    const data = {
      _subject: `[PAA] Contact request for ${currentPerson.name}`,
      from_name: name,
      from_contact: contact,
      to_person: currentPerson.fullName,
      purpose: purpose,
      message: message,
      _replyto: contact,
    };
    const FORMSPREE_URL = 'https://formspree.io/f/xwvyzbvr';
    try {
      const resp = await fetch(FORMSPREE_URL, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(data) });
      if (resp.ok) {
        document.getElementById("contact-form-container").style.display = "none";
        document.getElementById("contact-success").style.display = "block";
      } else throw new Error();
    } catch(e) {
      errorDiv.textContent = "❌ " + (currentLang === 'ru' ? "Ошибка отправки. Попробуйте позже." : "Sending error. Please try again.");
      errorDiv.style.display = "block";
    } finally {
      btn.textContent = original;
      btn.disabled = false;
    }
  }

  // ---- Инициализация ----
  document.getElementById("lang-switch").addEventListener("click", () => setLanguage(currentLang === 'ru' ? 'en' : 'ru'));
  document.getElementById("topJoinBtn").addEventListener("click", openJoinFormModal);
  document.getElementById("bottomJoinBtn").addEventListener("click", openJoinFormModal);
  document.getElementById("joinModal").addEventListener("click", e => { if (e.target === document.getElementById("joinModal")) closeJoinModal(); });
  document.getElementById("contactModal").addEventListener("click", e => { if (e.target === document.getElementById("contactModal")) closeContactModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closeJoinModal(); closeContactModal(); } });
  const searchInp = document.getElementById("search-input");
  if (searchInp) searchInp.addEventListener("input", onSearchInput);

  // Применяем язык без рендера карточек (данных ещё нет)
  document.documentElement.lang = currentLang === 'ru' ? 'ru' : 'en';
  document.querySelector('#lang-switch').textContent = currentLang === 'ru' ? 'EN' : 'RU';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[currentLang][key]) el.textContent = translations[currentLang][key];
  });
  updateSearchPlaceholder();
  updateJoinButtons();

  // Загружаем людей из Google Sheets
  loadPeople();
  window.addEventListener('scroll', () => {
    document.getElementById('scroll-top').classList.toggle('visible', window.scrollY > 400);
  });
</script>
