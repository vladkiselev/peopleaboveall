# Free Supabase projects pause after a week without activity.
# A daily read keeps the database awake; re-enabling the workflow resets
# GitHub's 60-day inactivity timer so the schedule itself never stops.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # Public anon key (already in the site's HTML); RLS allows reading visible rows only
      SUPABASE_URL: https://gqcqvaawyeyifgfdqhoi.supabase.co
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxY3F2YWF3eWV5aWZnZmRxaG9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDMyOTIsImV4cCI6MjA5NTU3OTI5Mn0.EHUjl6orIrhkSHD4bVSgV02JXASlZhqF-j64HE3LgKE
    steps:
      - name: Query the database
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            "$SUPABASE_URL/rest/v1/people?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY"
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-ping.yml/enable"
